name: Python checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest test_purchase_corrections test_maintenance test_mcp test_orders test_quantities test_return_corrections test_rules test_rooms test_owned test_service verify_local
      - run: python demo.py
