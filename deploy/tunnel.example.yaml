config_version: 1
control_plane:
  base_url: "https://api.openai.com"
  tunnel_id: "REPLACE_WITH_YOUR_TUNNEL_ID"
  api_key: "env:CONTROL_PLANE_API_KEY"
health:
  listen_addr: "127.0.0.1:0"
admin_ui:
  open_browser: false
log:
  level: info
  format: json
mcp:
  commands:
    - channel: main
      command: "/home/admin/personal-assistant/.venv/bin/python /home/admin/personal-assistant/mcp_server.py --db /home/admin/personal-assistant/data/personal.sqlite3"
